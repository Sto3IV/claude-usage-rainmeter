X=#ClockX#
Y=#ClockY#
StringAlign=Right
FontFace=#ClockFont#
FontWeight=#ClockFontWeight#
FontSize=#ClockSize#
FontColor=255,255,255
AntiAlias=1
DynamicVariables=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=(#ClockX# - #DateOffset#)
Y=#DateY#
StringAlign=Right
FontFace=#DateFont#
FontWeight=#DateFontWeight#
FontSize=#DateSize#
FontColor=255,255,255
AntiAlias=1
DynamicVariables=1
;### MIDDLE — AI USAGE PANELS ##################################################
; Claude + Antigravity side by side (14..150), Grok spanning both beneath
; (163..237). Grok's bottom edge is the bar's shared bottom line, level with the
; date's ink; nothing in the skin sits below it. 12px gap in both directions.

[mtrClaudePanel]
Meter=Shape
X=#AIX#
Y=#AITopY#
Shape=Rectangle 0.5,0.5,(#AIPanelW#-1),(#AITopH#-1),3 | Fill Color #AIPanelBg# | StrokeWidth 1 | Stroke Color #AIPanelEdge#
DynamicVariables=1

; The header row is CenterCenter: Y is the middle of the band between the panel's
; top border (14) and the rule (44), so the caps sit level in it -- 8 empty rows
; above the ink and 9 below, against 7/10 when the meter was anchored by its top.
; The status rides the same Y, so it can never drift off the title again.
[mtrClaudeHead]
Meter=String
MeterStyle=ai.head
Text=CLAUDE
X=(#AIX#+#AIPanelW#/2)
Y=29
W=178
DynamicVariables=1

[mtrClaudeStatus]
Meter=String
MeterStyle=ai.status
Text=#ClaudeStatus#
X=(#AIX#+#AIPanelW#-#AIPad#)
Y=26
W=88
DynamicVariables=1

[mtrClaudeRule]
Meter=Image
SolidColor=#AIRuleColor#
X=(#AIX#+#AIPad#)
Y=44
W=178
H=1
DynamicVariables=1
; Label rows sit 3px above where the block rhythm alone would put them: the
; descenders of "Session (5h)" / "Weekly (7d)" reach Y+15, and at the old Y they
; landed 1px off the accent bar. Every label row now keeps 4 clear rows above it.
[mtrClaudeSessionTextLabel]
Meter=String
MeterStyle=ai.label
Text=Session (5h)
X=(#AIX#+#AIPad#)
Y=50
W=110
DynamicVariables=1

[mtrClaudeSessionTextValue]
