PrimaryColor=#Graph3Color#,#HistogramTransparency#
X=(#SysX#+1)
Y=(#SysRow3Y#+1)
W=28
H=38
AntiAlias=1
DynamicVariables=1

[Line3]
Meter=Line
MeasureName=mNetInGraph
LineColor=#Graph3Color#
LineCount=1
X=(#SysX#+1)
Y=(#SysRow3Y#+1)
W=28
H=38
AntiAlias=1
DynamicVariables=1

[Histogram3Out]
