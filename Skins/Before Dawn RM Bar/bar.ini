X=#SysLabelX#
Y=#SysRow3Y#
W=200
H=18
ClipString=1
DynamicVariables=1
; In/Out rate in MB/s (Scale=1048576), 2 decimals

[Label3In]
Meter=String
FontFace=#ValueFont#
FontWeight=#ValueFontWeight#
FontSize=10
FontColor=#Graph3Color#
AntiAlias=1
MeasureName=mNetIn
Text=In %1 MB
Scale=1048576
NumOfDecimals=2
X=#SysLabelX#
Y=(#SysRow3Y#+20)
W=78
H=16
