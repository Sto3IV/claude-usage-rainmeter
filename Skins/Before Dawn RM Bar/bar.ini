; Rows: #SysRow1Y# / #SysRow2Y# / #SysRow3Y#

[TextSystems]
Meter=String
MeterStyle=label.style1
FontSize=#HeaderFontSize#
Text=System:
X=#SysX#
Y=21
DynamicVariables=1
;----- CPU row -----

[Grid1]
Meter=Image
ImageName=Grid1.png
X=#SysX#
Y=#SysRow1Y#
W=60
H=40
ImageAlpha=#FramesTransparency#
DynamicVariables=1

[Histogram1]
Meter=Histogram
MeasureName=mCPU
PrimaryColor=#Graph1Color#,#HistogramTransparency#
X=(#SysX#+1)
Y=(#SysRow1Y#+1)
W=58
H=38
AntiAlias=1
DynamicVariables=1

[Line1]
Meter=Line
MeasureName=mCPU
LineColor=#Graph1Color#
LineCount=1
X=(#SysX#+1)
Y=(#SysRow1Y#+1)
W=58
H=38
AntiAlias=1
DynamicVariables=1

[Label1]
Meter=String
MeterStyle=label.style1
Text=CPU
X=#SysLabelX#
Y=#SysRow1Y#
W=200
H=18
ClipString=1
DynamicVariables=1

[Label1Value]
Meter=String
MeterStyle=label.style2
MeasureName=mCPU
Text=%1%
X=#SysLabelX#
Y=(#SysRow1Y#+22)
W=200
H=16
ClipString=1
DynamicVariables=1
;----- RAM row -----

[Grid2]
Meter=Image
ImageName=Grid2.png
X=#SysX#
Y=#SysRow2Y#
W=60
H=40
ImageAlpha=#FramesTransparency#
DynamicVariables=1

[Histogram2]
Meter=Histogram
MeasureName=mRAM
PrimaryColor=#Graph2Color#,#HistogramTransparency#
X=(#SysX#+1)
Y=(#SysRow2Y#+1)
W=58
H=38
AntiAlias=1
DynamicVariables=1

[Line2]
Meter=Line
MeasureName=mRAM
LineColor=#Graph2Color#
LineCount=1
X=(#SysX#+1)
Y=(#SysRow2Y#+1)
W=58
H=38
AntiAlias=1
DynamicVariables=1

[Label2]
Meter=String
MeterStyle=label.style1
Text=RAM
X=#SysLabelX#
Y=#SysRow2Y#
W=200
H=18
ClipString=1
