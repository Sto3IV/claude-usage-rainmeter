[Rainmeter]
by=lianx-design@deviantart
Update=1000
AccurateText=1

;===============================================================================
; Before Dawn RM Bar — customized (1200×262)
; Layout (ref: TMexe style + Before Dawn substrate):
;   LEFT  → CPU / RAM / Internet (mini grids + histograms)
;   MID   → AI usage: Claude + Antigravity, Grok beneath
;   RIGHT → Clock + Date
;
; The AI panels and the date bottom on y=237, the date's last ink row, and
; nothing is drawn below it; the remaining 24px is the bar's bottom margin.
; The left System block keeps its own compact 55px row step and ends at 205.
;===============================================================================

[Variables]
Font=Inter
; Labels (Systems/CPU/RAM/Internet/Programs/Sites) → Inter
LabelFont=Inter
LabelFontWeight=400
HeaderFontSize=16
; Clock → Jost Thin
ClockFont=Jost
ClockFontWeight=100
ClockSize=133
ClockY=-15
; Values (CPU%, RAM digits, traffic) → Jost
ValueFont=Jost
ValueFontWeight=400
; Date → Montserrat Thin
BarWidth=1200
BarHeight=262
; Substrate opacity 0-100 (0=clear, 100=solid black)
; Main 15/100, top edge 20/100 @ 5px, no bottom edge
BgColor=14,14,14
BgEdgeColor=249,255,253
BgMainAlpha=38
BgEdgeAlpha=51
BgEdgeH=5
; --- Layout anchors ---
; Left system block (absolute coords — no overlapping r-chains)
SysX=20
SysLabelX=92
SysGraphW=58
SysGraphH=38
SysRow1Y=56
; 15px gap between CPU/RAM/Internet blocks (row H=40)
SysRowGap=15
SysRowH=40
SysRow2Y=111
SysRow3Y=166
; Middle: Programs + Sites
; Vertical | between Systems and Programs/Sites
SepBarX=300
SepBarFont=Inter
SepBarFontWeight=100
SepBarSize=140
SepBarColor=255,255,255,31
MidX=340
IconStep=65
IconW=59
; Center of the 4-icon row: MidX + (3*IconStep + IconW)/2
MidCenterX=(#MidX# + (3*#IconStep# + #IconW#)/2)
ClockX=1158
; Nudge date left so it sits under the visual center of HH:MM (not flush to right edge)
DateY=191
DateOffset=28
DateFont=Montserrat
DateFontWeight=100
DateSize=30
; --- TMexe-style graph colors ---
Graph1Color=20,125,180
Graph2Color=150,20,180
Graph3Color=240,120,30
Graph32Color=60,145,200
HistogramTransparency=55
FramesTransparency=180
; Internet graph full scale = 50 MB/s via Calc mNet*Graph (Formula=bytes/52428800)
Download=52428800
Upload=52428800

; --- AI usage panels -----------------------------------------------------
; Fetchers and snapshots stay in Skins\AIUsageLimits so there is one copy of
; them; this skin only reads. Move or rename that folder and the panels go to
; "no data".
AIRoot=#SKINSPATH#AIUsageLimits\@Resources\
; Labels → Inter, numbers → Fira Code (monospace, so the % and countdown
; columns line up across all three panels without hand-padding)
TextFont=Inter
NumFont=Fira Code
; Two panels of 198 on top with a 12px gap, Grok spanning both beneath.
; Right edge 720 keeps 17px clear of the clock, whose width varies by digit.
AIX=312
AIX2=522
AIPanelW=198
AIWideW=408
AIPad=10
AITopY=14
AITopH=137
AIGrokY=163
AIGrokH=74
AIPanelBg=10,10,12,90
AIPanelEdge=255,255,255,28
AIRuleColor=255,255,255,30
AIHeadColor=255,255,255,230
AILabelColor=255,255,255,235
AIMutedColor=255,255,255,120
AIMutedValue=255,255,255,145
AITrackColor=255,255,255,20
; Per-service accents, mirroring how the left block colour-codes CPU/RAM/Net
AIClaudeAccent=235,140,60
AIAntiAccent=66,133,244
AIGrokAccent=200,200,210
; Defaults so the meters render before aiusage.lua's first Apply() lands
ClaudeSession=0
ClaudeSessionText=--
ClaudeSessionReset=--
ClaudeWeekly=0
ClaudeWeeklyText=--
ClaudeWeeklyReset=--
ClaudeStatus=
AntiSession=0
AntiSessionText=--
AntiSessionReset=--
AntiWeekly=0
AntiWeeklyText=--
AntiWeeklyReset=--
AntiStatus=
GrokWeekly=0
GrokWeeklyText=--
GrokWeeklyReset=--
GrokStatus=

;### STYLES ####################################################################

[label.style1]
FontFace=#LabelFont#
FontWeight=#LabelFontWeight#
FontSize=14
FontColor=255,255,255
StringStyle=Bold
AntiAlias=1

[label.style2]
FontFace=#ValueFont#
FontWeight=#ValueFontWeight#
FontSize=10
FontColor=220,220,220
AntiAlias=1

[histogram.style1]
H=38
W=58
AntiAlias=1

[line.style1]
H=38
W=58
LineCount=1
AntiAlias=1

;--- AI panel type scale -------------------------------------------------------

; ClipString clips the string to the meter's W x H, so H has to cover the whole
; GDI+ line box -- Inter's is 1.21em -- and not just the cap height:
; ceil(1.21 * FontSize * 96/72). At FontSize=10 that is 17; the old per-meter
; H=14 cut the bottom two rows off the descenders of "Weekly (7d)". H lives in
; the styles so there is one place to get it wrong, not thirty.
[ai.head]
FontFace=#TextFont#
FontWeight=600
FontSize=11
FontColor=#AIHeadColor#
StringAlign=CenterCenter
AntiAlias=1
ClipString=1
H=18

; Size 7 and top-anchored, so Y can state the baseline outright: the status
; shares the header row with the title and has to sit on the same line as it.
; Centring it instead (as the title is centred) put its baseline 1.45px high,
; and aligning the line-box bottoms would be 1.3px out the other way, because
; descent scales with the size. H=13 is one row over the 12 the formula asks
; for at size 7 -- "expired" and "corrupt" carry descenders.
[ai.status]
FontFace=#TextFont#
FontWeight=400
FontSize=7
FontColor=#AIMutedColor#
StringAlign=Right
AntiAlias=1
ClipString=1
H=13

[ai.label]
FontFace=#TextFont#
FontWeight=400
FontSize=10
FontColor=#AILabelColor#
AntiAlias=1
ClipString=1
H=17

[ai.value]
FontFace=#NumFont#
FontWeight=500
FontSize=10
FontColor=#AILabelColor#
StringAlign=Right
AntiAlias=1
ClipString=1
H=17

[ai.sublabel]
FontFace=#TextFont#
FontWeight=400
FontSize=9
FontColor=#AIMutedColor#
AntiAlias=1
ClipString=1
H=15

[ai.subvalue]
FontFace=#NumFont#
FontWeight=400
FontSize=9
FontColor=#AIMutedValue#
StringAlign=Right
AntiAlias=1
ClipString=1
H=15

[ai.bar]
BarOrientation=HORIZONTAL
SolidColor=#AITrackColor#
H=1

;### BACKGROUND (Before Dawn substrate) ########################################

[MeterBG]
Meter=String
SolidColor=14,14,14,38
X=0
Y=0
W=#BarWidth#
H=#BarHeight#
DynamicVariables=1

;### MEASURES ##################################################################

[mCPU]
Measure=CPU

[mRAM]
Measure=PhysicalMemory

[mRAMTotal]
Measure=PhysicalMemory
Total=1

[mNetIn]
Measure=NetIn
; Raw bytes/s for text labels (In xx MB)
DynamicVariables=1

[mNetOut]
Measure=NetOut
; Raw bytes/s for text labels (Out xx MB)
DynamicVariables=1

; Graph scale: 100% of histogram = 50 MB/s exactly
; (NetInSpeed/MaxValue alone can under-scale on some Win/RM setups)
[mNetInGraph]
Measure=Calc
Formula=(mNetIn / 52428800)
MinValue=0
MaxValue=1
DynamicVariables=1

[mNetOutGraph]
Measure=Calc
Formula=(mNetOut / 52428800)
MinValue=0
MaxValue=1
DynamicVariables=1

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%a, %d %B %Y

;--- AI usage -----------------------------------------------------------------
; One script drives all three panels: reads the snapshots, reruns the countdowns
; every tick, and schedules each fetcher on its own timer with failure backoff.

[MeasureAI]
Measure=Script
ScriptFile=#@#aiusage.lua
UpdateDivider=1

; Timeout is MILLISECONDS, and State=Hide makes RunCommand kill rather than
; close. At 25 it killed cmd.exe before Python could start.
[MeasureFetchClaude]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c ""#AIRoot#Claude\fetch.cmd""
StartInFolder=#AIRoot#Claude\
State=Hide
OutputType=UTF8
Timeout=25000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureAI "Refresh()"]

[MeasureFetchAnti]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c ""#AIRoot#Antigravity\fetch.cmd""
StartInFolder=#AIRoot#Antigravity\
State=Hide
OutputType=UTF8
Timeout=25000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureAI "Refresh()"]

[MeasureFetchGrok]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c ""#AIRoot#Grok\fetch.cmd""
StartInFolder=#AIRoot#Grok\
State=Hide
OutputType=UTF8
Timeout=25000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureAI "Refresh()"]

[mClaudeSessionBar]
Measure=Calc
Formula=#ClaudeSession#
MinValue=0
MaxValue=100
DynamicVariables=1

[mClaudeWeeklyBar]
Measure=Calc
Formula=#ClaudeWeekly#
MinValue=0
MaxValue=100
DynamicVariables=1

[mAntiSessionBar]
Measure=Calc
Formula=#AntiSession#
MinValue=0
MaxValue=100
DynamicVariables=1

[mAntiWeeklyBar]
Measure=Calc
Formula=#AntiWeekly#
MinValue=0
MaxValue=100
DynamicVariables=1

[mGrokWeeklyBar]
Measure=Calc
Formula=#GrokWeekly#
MinValue=0
MaxValue=100
DynamicVariables=1

;### LEFT — SYSTEMS (TMexe grids, absolute layout) #############################
