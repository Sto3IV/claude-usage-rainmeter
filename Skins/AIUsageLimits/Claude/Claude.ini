[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureFetch "Run"]
ContextTitle2=Open credentials folder
ContextAction2=["#USERPROFILE#\.claude"]

[Metadata]
Name=Claude Usage
Author=Sto3IV
Information=Session (5h) and Weekly (7d) used Claude Code limits from /api/oauth/usage.
Version=2.0.2
License=MIT

[Variables]
SessionUsed=0
WeeklyUsed=0
SessionUsedText=--
WeeklyUsedText=--
SessionReset=--
WeeklyReset=--
Error=Waiting for first fetch...
HasData=0
ErrorHidden=0
fontName=Trebuchet MS
textSize=8
colorBar=235,170,0,255
colorText=255,255,255,205

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureFetch]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c ""#@#Claude\fetch.cmd""
StartInFolder=#@#Claude\
State=Hide
OutputType=UTF8
; Milliseconds, not seconds. State=Hide means the plugin KILLS the process at
; this mark, so anything under a second kills cmd before Python can start.
Timeout=25000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureParse "Apply()"][!UpdateMeasure MeasureSessionBar][!UpdateMeasure MeasureWeeklyBar][!UpdateMeter *][!Redraw]

[MeasureParse]
Measure=Script
ScriptFile=#@#Claude\parse.lua
UpdateDivider=1

[MeasureSessionBar]
Measure=Calc
Formula=#SessionUsed#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureWeeklyBar]
Measure=Calc
Formula=#WeeklyUsed#
MinValue=0
MaxValue=100
DynamicVariables=1

; ----------------------------------
; STYLES
; ----------------------------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

[styleReset]
StringAlign=Left
StringCase=None
StringStyle=Normal
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,120
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

; ----------------------------------
; METERS
; ----------------------------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=Claude Usage
LeftMouseUpAction=[!CommandMeasure MeasureFetch "Run"]
ToolTipText=Click to refresh

[meterSessionLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=Session (5h)

[meterSessionValue]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#SessionUsedText#
DynamicVariables=1

[meterSessionBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=MeasureSessionBar
X=10
Y=53
W=190
H=1

[meterSessionResetLabel]
Meter=String
MeterStyle=styleReset
X=10
Y=60
W=190
H=14
Text=Resets

[meterSessionReset]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#SessionReset#
DynamicVariables=1

[meterWeeklyLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=90
W=190
H=14
Text=Weekly (7d)

[meterWeeklyValue]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#WeeklyUsedText#
DynamicVariables=1

[meterWeeklyBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=MeasureWeeklyBar
X=10
Y=103
W=190
H=1

[meterWeeklyResetLabel]
Meter=String
MeterStyle=styleReset
X=10
Y=110
W=190
H=14
Text=Resets

[meterWeeklyReset]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#WeeklyReset#
DynamicVariables=1

[meterError]
Meter=String
MeterStyle=styleLeftText
ClipString=2
X=10
Y=130
W=190
H=28
Text=#Error#
Hidden=#ErrorHidden#
DynamicVariables=1
