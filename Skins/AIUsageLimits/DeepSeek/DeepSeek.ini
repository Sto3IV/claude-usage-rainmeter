[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Background=#@#Background.png
BackgroundMode=3
BackgroundMargins=0,34,0,14
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureFetch "Run"]
ContextTitle2=Open credentials folder
ContextAction2=["#USERPROFILE#\.deepseek"]

[Metadata]
Name=DeepSeek Credits
Author=Ranni & Celian
Information=USD and CNY balance credits from DeepSeek API /user/balance.
Version=3.0.0
License=MIT

[Variables]
USDText=--
CNYText=--
USDSub=--
CNYSub=--
Error=Waiting for first fetch...
ErrorHidden=0
fontName=Trebuchet MS
textSize=8
colorBar=77,107,254,255
colorText=255,255,255,205

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureFetch]
Measure=Plugin
Plugin=RunCommand
Program=cmd
Parameter=/c ""#@#DeepSeek\fetch.cmd""
StartInFolder=#@#DeepSeek\
State=Hide
OutputType=UTF8
Timeout=25000
DynamicVariables=1
FinishAction=[!CommandMeasure MeasureParse "Apply()"][!UpdateMeter *][!Redraw]

[MeasureParse]
Measure=Script
ScriptFile=#@#DeepSeek\parse.lua
UpdateDivider=1

; ----------------------------------
; STYLES
; ----------------------------------

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

[styleReset]
StringAlign=Left
StringCase=None
StringStyle=Normal
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=255,255,255,120
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

; ----------------------------------
; METERS
; ----------------------------------

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=DeepSeek Credits
LeftMouseUpAction=[!CommandMeasure MeasureFetch "Run"]
ToolTipText=Click to refresh

[meterUSDLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=USD Balance

[meterUSDValue]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#USDText#
DynamicVariables=1

[meterUSDBar]
Meter=Image
SolidColor=#colorBar#
X=10
Y=53
W=190
H=1

[meterUSDSubLabel]
Meter=String
MeterStyle=styleReset
X=10
Y=60
W=190
H=14
Text=Status

[meterUSDSub]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#USDSub#
DynamicVariables=1

[meterCNYLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=90
W=190
H=14
Text=CNY Balance

[meterCNYValue]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#CNYText#
DynamicVariables=1

[meterCNYBar]
Meter=Image
SolidColor=#colorBar#
X=10
Y=103
W=190
H=1

[meterCNYSubLabel]
Meter=String
MeterStyle=styleReset
X=10
Y=110
W=190
H=14
Text=Conversion

[meterCNYSub]
Meter=String
MeterStyle=styleRightText
X=198
Y=0r
W=190
H=14
Text=#CNYSub#
DynamicVariables=1

[meterError]
Meter=String
MeterStyle=styleLeftText
ClipString=2
X=10
Y=130
W=190
H=28
Text=#Error#
Hidden=#ErrorHidden#
DynamicVariables=1
